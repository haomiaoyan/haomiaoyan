<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="浩渺烟波 — 让复杂，看得见">
  <defs>
    <linearGradient id="ts-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b23"/><stop offset="1" stop-color="#181b23"/>
    </linearGradient>
    <filter id="ts-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <rect id="p" width="10" height="10" rx="2"/>
    <rect id="q" width="8" height="8"/>
    <filter id="ts-hue-a" x="-30%" y="-30%" width="160%" height="160%"><feColorMatrix type="hueRotate" values="150"/></filter>
    <filter id="ts-hue-b" x="-30%" y="-30%" width="160%" height="160%"><feColorMatrix type="hueRotate" values="300"/></filter>
  </defs>

  <rect width="1200" height="480" fill="url(#ts-stage)"/>

  <g filter="url(#ts-shadow)">
    <rect x="80" y="40" width="1040" height="400" rx="14" fill="#101217"/>
    <rect x="80" y="40" width="1040" height="38" rx="14" fill="#282c36"/>
    <rect x="80" y="60" width="1040" height="18" fill="#282c36"/>
    <line x1="80" y1="78" x2="1120" y2="78" stroke="#0a0c14" stroke-width="0.6"/>
  </g>

  <g font-family="Consolas, 'Microsoft YaHei', monospace">
    <circle cx="106" cy="59" r="6" fill="#ff817c"/><circle cx="128" cy="59" r="6" fill="#eed080"/><circle cx="150" cy="59" r="6" fill="#b0dc8a"/>
    <text x="600" y="65" text-anchor="middle" font-size="17" fill="#b7b9c5">haomiaoyan.exe — 把复杂做成能看见的</text>

    <text x="118" y="123" font-size="20" fill="#b0dc8a">haomiaoyan@earth:~$ ./build-my-world</text>
    <rect x="566" y="107" width="10" height="20" fill="#b0dc8a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="115" y="205" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="58" font-weight="700" fill="#f3eee6">让复杂，看得见。</text>
    <text x="118" y="246" font-size="20" fill="#acafbb">浩渺烟波 / 把想法做成能点开的东西</text>

    <text x="118" y="300" font-size="20" fill="#e9e7ec"><tspan fill="#b0dc8a">&gt; </tspan>build --interactive-stories</text>
    <text x="118" y="333" font-size="20" fill="#e9e7ec"><tspan fill="#b0dc8a">&gt; </tspan>ship --ai-x-visualization</text>
    <text x="118" y="383" font-size="18" fill="#bba5ee">[note] 想法比手快，正在逐个实现。</text>

    <path d="M80 407 H1120" stroke="#333845"/>
    <text x="118" y="429" font-size="16" fill="#9298aa">CREATIVE CODER / AI × 可视化 / 交互叙事</text>
    <text x="1080" y="429" text-anchor="end" font-size="16" fill="#b0dc8a">● STILL BUILDING</text>
  </g>

  <!-- pixel-art typing hands: green + violet, SMIL glitch (GitHub-safe) -->
  <g id="pixel-typing">
    <g id="kb-base" fill="#262c37">
      <rect x="840" y="248" width="176" height="42" rx="4"/>
    </g>
    <g id="kb-keys" fill="#3a4150">
      <use href="#q" x="848" y="254"/><use href="#q" x="860" y="254"/><use href="#q" x="872" y="254"/><use href="#q" x="884" y="254"/><use href="#q" x="896" y="254"/><use href="#q" x="908" y="254"/><use href="#q" x="920" y="254"/><use href="#q" x="932" y="254"/><use href="#q" x="944" y="254"/><use href="#q" x="956" y="254"/><use href="#q" x="968" y="254"/><use href="#q" x="980" y="254"/><use href="#q" x="992" y="254"/>
      <use href="#q" x="852" y="264"/><use href="#q" x="864" y="264"/><use href="#q" x="876" y="264"/><use href="#q" x="888" y="264"/><use href="#q" x="900" y="264"/><use href="#q" x="912" y="264"/><use href="#q" x="924" y="264"/><use href="#q" x="936" y="264"/><use href="#q" x="948" y="264"/><use href="#q" x="960" y="264"/><use href="#q" x="972" y="264"/><use href="#q" x="984" y="264"/>
      <use href="#q" x="868" y="274"/><use href="#q" x="880" y="274"/><use href="#q" x="892" y="274"/><use href="#q" x="904" y="274"/><use href="#q" x="916" y="274"/><use href="#q" x="928" y="274"/><use href="#q" x="940" y="274"/><use href="#q" x="952" y="274"/><use href="#q" x="964" y="274"/>
    </g>
    <g id="kb-lit" fill="#b0dc8a">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="1.6s" repeatCount="indefinite"/>
      <use href="#q" x="884" y="254"/><use href="#q" x="936" y="264"/>
    </g>

    <g id="hand-left" fill="#b0dc8a">
      <rect x="856" y="192" width="40" height="22" rx="2"/>
      <rect x="859" y="214" width="8" height="16"/><rect x="870" y="214" width="8" height="21"/><rect x="881" y="214" width="8" height="19"/><rect x="892" y="214" width="8" height="14"/>
    </g>
    <g id="hand-right" fill="#bba5ee">
      <rect x="956" y="192" width="40" height="22" rx="2"/>
      <rect x="956" y="214" width="8" height="14"/><rect x="967" y="214" width="8" height="19"/><rect x="978" y="214" width="8" height="21"/><rect x="989" y="214" width="8" height="16"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0;0 5;0 0" keyTimes="0;0.12;0.25;0.4;0.5" dur="1.3s" repeatCount="indefinite"/>
      <use href="#hand-left"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0;0 6;0 0" keyTimes="0;0.2;0.32;0.45;0.55" dur="1.3s" repeatCount="indefinite"/>
      <use href="#hand-right"/>
    </g>

    <g>
      <animate attributeName="opacity" calcMode="discrete" values="0;0.85;0;0" keyTimes="0;0.44;0.47;1" dur="9s" repeatCount="indefinite"/>
      <use href="#hand-left" filter="url(#ts-hue-a)" transform="translate(6 0)"/>
      <use href="#hand-right" filter="url(#ts-hue-b)" transform="translate(-6 0)"/>
      <rect x="900" y="190" width="8" height="8" fill="#3ee6ff"/>
      <rect x="948" y="210" width="8" height="8" fill="#ff4fd8"/>
      <rect x="940" y="176" width="6" height="6" fill="#c8ff3e"/>
    </g>
    <g>
      <animate attributeName="opacity" calcMode="discrete" values="0;0.8;0;0" keyTimes="0;0.72;0.75;1" dur="9s" repeatCount="indefinite"/>
      <use href="#hand-left" filter="url(#ts-hue-b)" transform="translate(-5 2)"/>
      <rect x="872" y="204" width="8" height="8" fill="#ffd23e"/>
      <rect x="992" y="200" width="8" height="8" fill="#3ee6ff"/>
    </g>
  </g>
</svg>
